name: Keep Render alive

# Pings the deployed addon every 10 minutes so Render's free-tier web service does
# not spin down (free instances spin down after 15 min of inactivity, causing a ~50s
# cold start that makes Stremio subtitle requests time out).
#
# Setup: in your GitHub repo, go to Settings -> Secrets and variables -> Actions ->
# Variables, and add a variable named RENDER_APP_URL with your addon URL, e.g.
#   https://groq-subs.onrender.com
# (no trailing slash). Until that variable is set, this workflow exits immediately.

on:
    schedule:
        # Every 10 minutes (GitHub Actions cron). Minimum granularity is 5 min and
        # runs may be delayed under load, but 10 min is safely under the 15-min limit.
        - cron: "*/10 * * * *"
    workflow_dispatch: {}

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping addon
              env:
                  APP_URL: ${{ vars.RENDER_APP_URL }}
              run: |
                  if [ -z "$APP_URL" ]; then
                    echo "RENDER_APP_URL variable is not set; skipping keep-alive."
                    exit 0
                  fi
                  echo "Pinging $APP_URL/manifest.json ..."
                  curl -fsS --max-time 60 "$APP_URL/manifest.json" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" || \
                    curl -fsS --max-time 60 "$APP_URL/" -o /dev/null -w "fallback HTTP %{http_code} in %{time_total}s\n"
