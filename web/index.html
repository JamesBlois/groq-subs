<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Groq Subs</title>
        <link rel="stylesheet" href="/assets/styles.css" />
        <script defer src="/assets/config.js"></script>
        <link rel="icon" type="image/png" href="/public/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
        <link rel="shortcut icon" href="/public/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
        <link rel="manifest" href="/public/site.webmanifest" />
    </head>
    <body>
        <main class="shell">
            <div class="layout">
                <section class="panel">
                    <div class="header-links">
                        <a
                            class="github-link"
                            href="https://github.com/awerks/stremio-double-subtitles"
                            target="_blank"
                            rel="noreferrer"
                            aria-label="View on GitHub"
                            title="View on GitHub"
                        >
                            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                                <path
                                    d="M12 2C6.48 2 2 6.58 2 12.25c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.5v-1.9c-2.78.62-3.37-1.22-3.37-1.22-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .08 1.53 1.06 1.53 1.06.9 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0 1 12 6.89c.85 0 1.7.12 2.5.35 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.64 1.03 2.76 0 3.94-2.34 4.81-4.57 5.07.36.32.68.94.68 1.9v2.81c0 .28.18.6.69.5A10.08 10.08 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"
                                />
                            </svg>
                        </a>
                        <a
                            class="stremio-addons-link"
                            href="https://stremio-addons.net/addons/double-subtitles"
                            target="_blank"
                            rel="noreferrer"
                            aria-label="View on Stremio Addons"
                            title="View on Stremio Addons"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 124.926 124.927"
                                aria-hidden="true"
                                focusable="false"
                            >
                                <defs>
                                    <linearGradient
                                        id="a"
                                        x1="1"
                                        x2=".296"
                                        y1="1"
                                        y2=".296"
                                        gradientUnits="objectBoundingBox"
                                    >
                                        <stop offset="0" stop-color="#1155d9" />
                                        <stop offset="1" stop-color="#7b5bf5" />
                                    </linearGradient>
                                </defs>
                                <g data-name="Group 2115" transform="translate(.001)">
                                    <rect
                                        width="88.336"
                                        height="88.336"
                                        fill="url(#a)"
                                        data-name="Rectangle 1065"
                                        rx="6"
                                        transform="rotate(45 31.231 75.4)"
                                    />
                                    <path
                                        fill="#fff"
                                        d="M83.389 61.658a1 1 0 0 1 0 1.611L54.75 84.334a1 1 0 0 1-1.592-.806V41.399a1 1 0 0 1 1.592-.806Z"
                                        data-name="Polygon 20"
                                    />
                                </g>
                            </svg>
                        </a>
                    </div>

                    <header>
                        <h1>Groq Subs</h1>
                        <p class="summary">
                            Chọn ngôn ngữ phụ đề nguồn, chọn model Groq để dịch sang ngôn ngữ đích, rồi cài addon vào
                            Stremio.
                        </p>
                    </header>

                    <form id="configForm" class="config-form">
                        <label>
                            <span>Source subtitles</span>
                            <select id="sourceLang" name="sourceLang">
                                {{sourceOptions}}
                            </select>
                        </label>
                        <label>
                            <span>Translate to</span>
                            <select id="targetLang" name="targetLang">
                                {{targetOptions}}
                            </select>
                        </label>
                        <label>
                            <span>Groq model</span>
                            <select id="groqModel" name="groqModel">
                                {{groqModelOptions}}
                            </select>
                        </label>
                        <label id="groqKeyField" class="groq-key-field">
                            <span>Groq API key</span>
                            <input
                                id="groqApiKey"
                                name="groqApiKey"
                                type="password"
                                autocomplete="off"
                                placeholder="Nhập Groq API Key..."
                            />
                            <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">
                                Lấy API key tại đây
                            </a>
                        </label>
                        <div class="test-api-row">
                            <button id="testApiKey" class="test-button" type="button">Test API key</button>
                            <span id="testStatus" class="test-status" role="status" aria-live="polite"></span>
                        </div>
                        <button type="submit">Install configured addon</button>
                    </form>
                    <p class="install-note">
                        Install this configured addon, then open a video in Stremio and select subtitles under the
                        translated language.
                    </p>
                    <div class="manifest">
                        <div class="manifest-row">
                            <button id="openStremioWeb" class="copy-button" type="button">
                                Install in Stremio Web
                            </button>
                            <button id="copyManifest" class="copy-button" type="button">Copy Manifest URL</button>
                        </div>
                        <span id="copyStatus" class="copy-status" role="status" aria-live="polite"></span>
                    </div>
                </section>

                <aside class="screenshots" aria-label="Double Subtitles screenshots">
                    <figure class="screenshot-card">
                        <img
                            src="/img/subtitles.webp"
                            alt="Stremio video player showing German and English subtitles at the same time"
                            width="1556"
                            height="811"
                        />
                        <figcaption>
                            <strong>About the service</strong>
                            <span>Translated subtitles appear together with the source subtitles.</span>
                        </figcaption>
                    </figure>
                    <figure class="screenshot-card screenshot-card-small">
                        <img
                            src="/img/subtitles-select.webp"
                            alt="Stremio subtitle menu with Double Subtitles selected as a subtitle variant"
                            width="656"
                            height="369"
                        />
                        <figcaption>
                            <strong>Select new subtitles</strong>
                            <span
                                >Choose the Double Subtitles variant in Stremio (under the translated language!).</span
                            >
                        </figcaption>
                    </figure>
                </aside>
            </div>
        </main>
    </body>
</html>
